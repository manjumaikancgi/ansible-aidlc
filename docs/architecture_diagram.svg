<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #f7f8fb; stroke: #1f2937; stroke-width: 2.5; rx: 18; ry: 18; }
      .center { fill: #eef2ff; stroke: #3730a3; stroke-width: 3; rx: 22; ry: 22; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111827; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #374151; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #3730a3; }
      .line { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #6b7280; stroke-width: 3; stroke-dasharray: 9 8; fill: none; marker-end: url(#arrow); }
      .pill { fill: #e0e7ff; stroke: #3730a3; stroke-width: 2; rx: 999; ry: 999; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#374151" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1100"/>

  <text x="800" y="70" text-anchor="middle" class="title">AI-DLC Workflow with Ansible at the Centre</text>
  <rect class="pill" x="555" y="92" width="490" height="42" rx="21" ry="21"/>
  <text x="800" y="120" text-anchor="middle" class="label">AI proposes • Ansible applies • Tests prove • Humans approve</text>

  <!-- top row -->
  <rect class="box" x="80" y="180" width="280" height="120"/>
  <text x="220" y="225" text-anchor="middle" class="text">Business need /</text>
  <text x="220" y="255" text-anchor="middle" class="text">change request</text>

  <rect class="box" x="420" y="180" width="310" height="120"/>
  <text x="575" y="223" text-anchor="middle" class="text">AI assistant</text>
  <text x="575" y="253" text-anchor="middle" class="small">requirements, tasks, draft logic</text>

  <rect class="center" x="800" y="160" width="360" height="160"/>
  <text x="980" y="208" text-anchor="middle" class="text" style="font-size:30px;font-weight:700;">ANSIBLE CORE</text>
  <text x="980" y="248" text-anchor="middle" class="small">inventory • roles • playbooks</text>
  <text x="980" y="278" text-anchor="middle" class="small">vars • templates • handlers</text>

  <rect class="box" x="1220" y="180" width="300" height="120"/>
  <text x="1370" y="225" text-anchor="middle" class="text">Human review</text>
  <text x="1370" y="255" text-anchor="middle" class="small">security, logic, approvals</text>

  <!-- arrows top -->
  <path class="line" d="M360 240 L420 240"/>
  <path class="line" d="M730 240 L800 240"/>
  <path class="line" d="M1160 240 L1220 240"/>

  <!-- middle left -->
  <rect class="box" x="90" y="390" width="300" height="150"/>
  <text x="240" y="438" text-anchor="middle" class="text">Validation layer</text>
  <text x="240" y="470" text-anchor="middle" class="small">ansible-lint</text>
  <text x="240" y="498" text-anchor="middle" class="small">syntax check • Molecule</text>

  <rect class="box" x="450" y="390" width="300" height="150"/>
  <text x="600" y="438" text-anchor="middle" class="text">Ephemeral /</text>
  <text x="600" y="470" text-anchor="middle" class="text">lower environment</text>
  <text x="600" y="498" text-anchor="middle" class="small">converge and verify</text>

  <rect class="box" x="810" y="390" width="350" height="150"/>
  <text x="985" y="438" text-anchor="middle" class="text">CI/CD pipeline</text>
  <text x="985" y="470" text-anchor="middle" class="small">test, approve, promote</text>
  <text x="985" y="498" text-anchor="middle" class="small">dev → test → stage → prod</text>

  <rect class="box" x="1220" y="390" width="300" height="150"/>
  <text x="1370" y="438" text-anchor="middle" class="text">Post-deploy</text>
  <text x="1370" y="470" text-anchor="middle" class="text">verification</text>
  <text x="1370" y="498" text-anchor="middle" class="small">health and drift checks</text>

  <!-- arrows middle -->
  <path class="line" d="M1370 300 L1370 390"/>
  <path class="line" d="M1220 465 L1160 465"/>
  <path class="line" d="M810 465 L750 465"/>
  <path class="line" d="M450 465 L390 465"/>

  <!-- bottom -->
  <rect class="box" x="250" y="640" width="360" height="150"/>
  <text x="430" y="688" text-anchor="middle" class="text">Feedback loop</text>
  <text x="430" y="720" text-anchor="middle" class="small">failures, diffs, logs, lessons</text>
  <text x="430" y="748" text-anchor="middle" class="small">improve prompts, roles, tests</text>

  <rect class="box" x="680" y="640" width="420" height="150"/>
  <text x="890" y="688" text-anchor="middle" class="text">Governance controls</text>
  <text x="890" y="720" text-anchor="middle" class="small">secrets handling • idempotency</text>
  <text x="890" y="748" text-anchor="middle" class="small">change review • rollback readiness</text>

  <path class="dashed" d="M1370 540 C1370 610, 1120 620, 1040 640"/>
  <path class="dashed" d="M810 540 C720 610, 610 620, 610 640"/>
  <path class="dashed" d="M600 540 C560 590, 500 610, 430 640"/>

  <!-- footer notes -->
  <rect class="pill" x="170" y="875" width="1260" height="120" rx="26" ry="26"/>
  <text x="800" y="922" text-anchor="middle" class="text">AI supports planning and explanation.</text>
  <text x="800" y="954" text-anchor="middle" class="small">Ansible remains the central automation engine that turns approved intent into repeatable system change.</text>
</svg>
